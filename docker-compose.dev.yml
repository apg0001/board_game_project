services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-boardgame}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-boardgame}"
      POSTGRES_DB: "${POSTGRES_DB:-boardgame_dev}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    environment:
      HTTP_ADDR: "${HTTP_ADDR:-:4000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      DATABASE_URL: "${DATABASE_URL:-postgres://boardgame:boardgame@postgres:5432/boardgame_dev?sslmode=disable}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app/apps/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:4000}"
      VITE_WS_URL: "${VITE_WS_URL:-ws://localhost:4000/ws}"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  web-node-modules:
  postgres-data:
  redis-data:
