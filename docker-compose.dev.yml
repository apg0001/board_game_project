services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    environment:
      HTTP_ADDR: "${HTTP_ADDR:-:4000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app/apps/api

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:4000}"
      VITE_WS_URL: "${VITE_WS_URL:-ws://localhost:4000/ws}"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  web-node-modules:
